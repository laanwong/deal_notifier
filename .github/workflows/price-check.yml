name: Update Prices

on:
  schedule:
    - cron: '0 22 * * *'   # 8:00 AM AEST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run price collector
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: python deal_notifier.py

      - name: Commit prices.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update prices $(date +%Y-%m-%d)"
          git push
