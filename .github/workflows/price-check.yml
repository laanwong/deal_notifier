name: Woolworths Price Check

on:
  schedule:
    # Runs every day at 08:00 AEST (22:00 UTC previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:   # allows manual trigger from the Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run price checker
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: python deal_notifier.py
