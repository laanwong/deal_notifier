name: Update Prices

on:
  schedule:
    - cron: '0 22 * * *'   # 8:00 AM AEST
  workflow_dispatch:

permissions:
  contents: write          # ← this is the important fix

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run price collector
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: python deal_notifier.py

      - name: Commit and push prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update prices $(date -u +%Y-%m-%d)"
            git push
          )
